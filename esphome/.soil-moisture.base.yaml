# =============================================================================
# Seeed XIAO Soil Moisture Sensor (ESP32-C6) -- shared firmware package
#
# This file is identical on every sensor. Everything that differs per device
# comes in through substitutions from the device file (see example.yaml):
#
#   required:  name, friendly_name, stay_awake_entity,
#              api_encryption_key
#   labels:    one of labels/.soil-moisture-labels-{de,en}.yaml
#   optional:  the tuning defaults in the substitutions block below
#
# Read CLAUDE.md before changing anything here. Several lines look arbitrary
# and are not (on_boot priority, no light for the PWM, USB settle time, ...).
# =============================================================================

substitutions:
  # ---- Firmware version -----------------------------------------------------
  # Shown as the project version in Home Assistant. The device file sets it
  # to the release tag it pulls (ref: ${firmware_version}), so HA shows what
  # really runs. "dev" = local include / not set.
  firmware_version: dev

  # ---- Auto-calibration tuning (defaults, override per device) --------------
  # Lower sanity limit. Reliably catches "analog frontend off" (measured:
  # 0.002 V). Do not raise it more than needed -- how far the voltage drops in
  # truly saturated soil is unknown.
  v_min_plausible: "0.60"
  # Upper sanity limit: only rejects a reading at the ADC's end of range. Units
  # differ a lot -- air read 2.384 V on one and 2.91 V on another (issue #28)
  # -- so it must stay well above any real reading. "Probe not in soil" cannot
  # be detected at the top end; air is learned as the dry extreme (0 %).
  v_max_plausible: "3.20"
  # Minimum learned span before a percentage is reported. Must stay well below
  # the real span of the probe (~0.18-0.40 V measured).
  min_span: "0.05"
  # Relative decay: fraction of the span both limits move inwards per day, so
  # a single outlier heals over time.
  decay_frac_per_day: "0.02"
  # A new extreme is accepted only if a second reading confirms it within
  # this tolerance.
  confirm_tol: "0.02"

  # ---- Status thresholds (percent) and sleep durations (minutes) ------------
  # Drier soil = measure more often.
  threshold_dry: "20"
  threshold_wet: "60"
  sleep_dry_min: "15"
  sleep_almost_dry_min: "60"
  sleep_wet_min: "480"
  sleep_error_min: "15"
  sleep_calibrating_min: "60"

  # ---- Wake window requested from HA (minutes) ------------------------------
  # Hard battery guard: when it expires the device sleeps, even if the
  # input_boolean in HA is still on.
  wake_budget_min: "10"

  # ---- Push button (issue #27) ----------------------------------------------
  # A short press (also from deep sleep: GPIO2 wakes the device) measures,
  # blinks the status colour for button_blink_s and keeps the device awake
  # for button_awake_s (e.g. for an OTA update). Both in seconds.
  button_awake_s: "300"
  button_blink_s: "15"

  # ---- USB detection settle time (ms) ---------------------------------------
  # ESP-IDF reports "USB connected" right after boot even on battery (see
  # CLAUDE.md). Do not remove or shorten drastically.
  usb_settle_ms: "500"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  project:
    name: norbertbaum.xiao-soil-moisture
    version: "${firmware_version}"

  # System headers for the USB host detection and the reset reason. Angle
  # bracket includes need no local file, so this also works when the package
  # is pulled from GitHub (a local "includes: - file.h" would be resolved
  # relative to the DEVICE file and not be found).
  includes:
    - <driver/usb_serial_jtag.h>
    - <esp_system.h>
    - <esp_sleep.h>

  # Priority 600 (ESPHome default) is MANDATORY, not arbitrary: ledc/gpio
  # outputs are set up at HARDWARE (800). With 800 on_boot raced against the
  # very outputs it drives. With 600 all hardware is guaranteed ready.
  on_boot:
    priority: 600
    then:
      # MUST run before the first measurement, otherwise the ADC reads ~0 V.
      - script.execute: sensor_hw_init
      - lambda: |-
          id(firmware_version_sensor).publish_state("${firmware_version}");
          // Woken from deep sleep by the push button (GPIO2)? Then this boot
          // IS the button press: blink the result and keep the device awake.
          auto cause = esp_sleep_get_wakeup_cause();
          if (cause == ESP_SLEEP_WAKEUP_GPIO || cause == ESP_SLEEP_WAKEUP_EXT1) {
            ESP_LOGI("button", "Woken by the push button");
            id(register_button_press).execute();
          }
      - script.execute: measure_and_sleep

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

web_server:
  port: 80
  # MUST stay false: otherwise web_server adds "ota: platform: web_server",
  # an unauthenticated plaintext /update endpoint that lets anyone on the
  # Wi-Fi flash arbitrary firmware -- regardless of the encrypted esphome OTA
  # below (issue #20).
  ota: false

logger:

api:
  encryption:
    key: ${api_encryption_key}

# OTA uploads are encrypted and authenticated with the API key (ESPHome
# >= 2026.9); no separate OTA password. The uploader refuses a plaintext
# upload, so a device whose running firmware was built with ESPHome < 2026.9
# must first be updated to a build that offers encryption (e.g. v1.1.0), see
# CLAUDE.md "OTA encryption".
ota:
  - platform: esphome
    encryption: {}

# OTA rollback protection (ESP-IDF, on by default): a new firmware must be
# marked good, otherwise the bootloader starts the previous one after the
# next reset. ESPHome does that after boot_is_good_after (60 s) or on deep
# sleep. Unplugging USB resets this board, so a quick test after an update
# used to roll it back silently (issue #33). measure_and_sleep therefore
# marks the boot good as soon as the HA API is connected -- from then on a
# further OTA is possible, which is what the protection is for.
safe_mode:
  id: safe_mode_control

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: high
  # Deliberately NO fallback hotspot (ap:) and NO captive_portal: the Wi-Fi
  # credentials come from the device config in the ESPHome Device Builder.
  # captive_portal would also auto-load "ota: platform: web_server" (a
  # plaintext /update endpoint), and on a deep-sleep device a hotspot is
  # useless anyway -- measure_and_sleep gives up after 60 s without Wi-Fi,
  # about when the hotspot would appear (issues #20, #23).

# Wall clock for the time based calibration decay. If not (yet) synced the
# decay is simply skipped for this measurement.
time:
  - platform: homeassistant
    id: ha_time

deep_sleep:
  id: deep_sleep_control
  # Safety net (issue #32): every valid measurement sets its own duration. If
  # the very first boot gets no ADC sample at all, the device would otherwise
  # sleep without a wake-up timer.
  sleep_duration: ${sleep_error_min}min
  # The push button wakes the device (GPIO2 is an LP GPIO on the ESP32-C6).
  # KEEP_AWAKE: while the button is held, sleep is deferred instead of waking
  # up again immediately.
  wakeup_pin:
    number: GPIO2
    mode: INPUT_PULLUP
    inverted: true
    allow_other_uses: true
  wakeup_pin_mode: KEEP_AWAKE

globals:
  # ---- Learned calibration (survives deep sleep via NVS) ----
  - id: dry_value            # highest (driest) confirmed voltage
    type: float
    restore_value: yes
    initial_value: '0'

  - id: wet_value            # lowest (wettest) confirmed voltage
    type: float
    restore_value: yes
    initial_value: '0'

  # Candidate for a new extreme, must be confirmed by a second reading.
  # MUST have restore_value: every measurement is its own boot.
  - id: pend_dry
    type: float
    restore_value: yes
    initial_value: '0'

  - id: pend_wet
    type: float
    restore_value: yes
    initial_value: '0'

  - id: last_ts              # unix time of the last measurement (for decay)
    type: uint32_t
    restore_value: yes
    initial_value: '0'

  # Were the limits seeded from a real reading? Guessed factory values
  # (2.75 / 1.2 V) were the original bug: wet_value can only be LOWERED, and
  # 1.2 V is below anything this hardware delivers -- a permanent fake floor.
  - id: cal_seeded
    type: bool
    restore_value: yes
    initial_value: "false"

  # ---- Operating mode ----
  - id: usb_powered          # detected on every boot, not stored
    type: bool
    restore_value: no
    initial_value: "false"

  - id: disable_sleep        # manual latching override from HA
    type: bool
    restore_value: no
    initial_value: "false"

  # ---- Wake window requested from HA ----
  # Deadline in millis(), 0 = no window open. Deliberately restore_value: no:
  # millis() starts at 0 again after deep sleep.
  - id: wake_window_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: wake_budget_min
    type: uint32_t
    restore_value: no
    initial_value: "${wake_budget_min}"

  # Soil ADC readings of the current measurement, collected by the repeat
  # loop in measure_and_sleep and reduced to a median afterwards.
  - id: soil_samples
    type: std::vector<float>
    restore_value: no

  # ---- Status LED ----
  # Result of the last measurement: 0 none, 1 wet (green), 2 almost dry
  # (yellow), 3 dry (red), 4 calibrating (yellow/green), 5 sensor error
  # (fast red). Set by the measurement, shown by led_show_status.
  - id: led_state
    type: int
    restore_value: no
    initial_value: "0"

  # A button press is pending: the next led_show_status blinks for
  # button_blink_s instead of the normal 5 s solid light.
  - id: button_pressed
    type: bool
    restore_value: no
    initial_value: "false"

  # The current wake window was opened by the button (not by HA).
  - id: wake_by_button
    type: bool
    restore_value: no
    initial_value: "false"

  - id: led_tick             # blink phase counter (250 ms steps)
    type: int
    restore_value: no
    initial_value: "0"

sensor:
  - platform: adc
    id: soil_sensor
    pin: GPIO1
    attenuation: 12db
    update_interval: never
    # Hardware averaging instead of blocking delay() loops in the lambda.
    samples: 16
    sampling_mode: avg

  - platform: template
    name: "${label_soil_moisture}"
    id: soil_moisture_percent
    unit_of_measurement: "%"
    device_class: moisture
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    force_update: true

  # ---- Diagnostic entities: the calibration values to follow along ----
  - platform: template
    name: "${label_soil_raw_voltage}"
    id: soil_raw
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    entity_category: diagnostic

  - platform: template
    name: "${label_cal_dry}"
    id: cal_dry_sensor
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 3
    update_interval: never
    entity_category: diagnostic

  - platform: template
    name: "${label_cal_wet}"
    id: cal_wet_sensor
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 3
    update_interval: never
    entity_category: diagnostic

  - platform: template
    name: "${label_cal_span}"
    id: cal_span_sensor
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 3
    update_interval: never
    entity_category: diagnostic

  - platform: template
    name: "${label_next_sleep}"
    id: next_sleep_sensor
    unit_of_measurement: "min"
    device_class: duration
    accuracy_decimals: 0
    update_interval: never
    entity_category: diagnostic

  # Raw battery voltage. Without it "Battery 0 %" is ambiguous: 0 % only means
  # "below 1.10 V" -- 0.0 V (pin on ground / frontend off) or 0.9 V (empty
  # cell) are completely different failures.
  - platform: template
    name: "${label_battery_voltage}"
    id: battery_raw
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    entity_category: diagnostic

  - platform: adc
    id: battery_sensor
    pin: GPIO0
    name: "${label_battery}"
    attenuation: 12db
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    filters:
      - lambda: |-
          id(battery_raw).publish_state(x);   // publish the raw value too
          // Eneloop (NiMH) discharge curve
          if (x >= 1.40) return 100.0;
          else if (x >= 1.35) return 95.0;
          else if (x >= 1.32) return 85.0;
          else if (x >= 1.30) return 75.0;
          else if (x >= 1.28) return 65.0;
          else if (x >= 1.25) return 55.0;
          else if (x >= 1.23) return 45.0;
          else if (x >= 1.20) return 35.0;
          else if (x >= 1.18) return 25.0;
          else if (x >= 1.15) return 15.0;
          else if (x >= 1.12) return 8.0;
          else if (x >= 1.10) return 3.0;
          else return 0.0;

text_sensor:
  - platform: template
    name: "${label_soil_status}"
    id: soil_status

  - platform: template
    name: "${label_power_mode}"
    id: power_mode
    entity_category: diagnostic

  # Why the device stayed awake or went to sleep -- visible in HA without
  # reading logs.
  - platform: template
    name: "${label_sleep_decision}"
    id: sleep_decision
    entity_category: diagnostic

  # WHEN the next measurement happens (issue #31), shown by HA as "in 59
  # minutes" / a clock time. A text sensor with an ISO 8601 UTC string, not a
  # numeric sensor: sensor values are float32, which resolves a unix time only
  # to 128 s. Published by decide_sleep.
  - platform: template
    name: "${label_next_measurement}"
    id: next_measurement_sensor
    device_class: timestamp
    entity_category: diagnostic

  # Firmware release (firmware_version, published in on_boot) and the ESPHome
  # version it was built with -- a build older than 2026.9 cannot do
  # encrypted OTA (issue #29).
  - platform: template
    name: "${label_firmware}"
    id: firmware_version_sensor
    icon: mdi:tag
    entity_category: diagnostic

  - platform: version
    name: "${label_esphome_version}"
    hide_timestamp: true
    entity_category: diagnostic

binary_sensor:
  # The "mailbox": the device FETCHES this wish from HA on every wake-up. The
  # other direction is impossible -- in deep sleep Wi-Fi and the API server
  # are off. If the helper does not exist, has_state() stays false and the
  # device keeps sleeping (fail-safe).
  - platform: homeassistant
    id: ha_stay_awake
    entity_id: ${stay_awake_entity}

  - platform: gpio
    pin:
      number: GPIO2
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true   # also the deep sleep wakeup pin
    # Not "button": that is the name of a loaded integration and reserved.
    id: push_button
    on_multi_click:
      # 3x short -> reset learned calibration
      - timing:
          - ON for at most 0.7s
          - OFF for at most 0.7s
          - ON for at most 0.7s
          - OFF for at most 0.7s
          - ON for at most 0.7s
          - OFF for at least 0.3s
        then:
          - script.execute: reset_calibration
      # 1x short -> measure now, blink the status, stay awake
      - timing:
          - ON for at most 1s
          - OFF for at least 1s
        then:
          - script.execute: on_button_press

switch:
  - platform: template
    name: "${label_disable_deep_sleep}"
    id: disable_sleep_switch
    optimistic: true
    # NOT ALWAYS_ON: that runs turn_on_action on EVERY boot -> never sleeps.
    # RESTORE_DEFAULT_OFF: off by default, but if switched on in HA it
    # survives deep sleep (NVS) -- a latching OTA window on battery.
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(disable_sleep) = true;'
    turn_off_action:
      - lambda: 'id(disable_sleep) = false;'

button:
  # Reset from HA too, not only via 3x button press on the device.
  - platform: template
    name: "${label_reset_calibration}"
    id: reset_cal_button
    entity_category: config
    on_press:
      - script.execute: reset_calibration

output:
  - platform: gpio
    pin: GPIO18
    id: yellow_led_output

  - platform: gpio
    pin: GPIO19
    id: green_led_output

  - platform: gpio
    pin: GPIO20
    id: red_led_output

  # ---- Analog frontend of the capacitive probe ----
  # The probe is a capacitor whose capacitance changes with moisture. Without
  # an AC signal nothing happens -- GPIO21 provides the 200 kHz excitation,
  # its rectified amplitude is what the ADC reads. Without the PWM GPIO1
  # reads a constant ~0.002 V.
  - platform: ledc
    pin: GPIO21
    id: pwm_output
    frequency: 200kHz

  # Power / switching of the analog part (Seeed reference design).
  # GPIO14 on, GPIO3 off -- without GPIO14 the battery ADC reads 0 V too.
  - platform: gpio
    pin: GPIO3
    id: gpio_3_output

  - platform: gpio
    pin: GPIO14
    id: gpio_14_output

light:
  - platform: binary
    id: yellow_led
    output: yellow_led_output

  - platform: binary
    id: green_led
    output: green_led_output

  - platform: binary
    id: red_led
    output: red_led_output

# Deliberately NO light component for the 200 kHz PWM (the Seeed original
# uses a monochromatic light). A light has restore_mode (default
# RESTORE_DEFAULT_OFF) and LightState::setup() runs at HARDWARE-1 (799) -- it
# switches off again what was switched on before. An output has no such
# semantics: output.set_level is final.

# In USB / debug mode re-measure regularly so HA shows live values. On
# battery the device is asleep long before this timer fires.
interval:
  - interval: 60s
    then:
      - if:
          condition:
            # wake_window_until_ms must be included, otherwise decide_sleep
            # never runs again during a requested window and the device
            # would stay awake until the next reset.
            lambda: |-
              return id(usb_powered) || id(disable_sleep) ||
                     id(wake_window_until_ms) > 0;
          then:
            - script.execute: measure_and_sleep

script:
  # Arm the analog frontend. Must run after EVERY boot -- including wake-up
  # from deep sleep, which loses GPIO and LEDC state. Without it the device
  # measures 0 V and reports a sensor error although the probe is in soil.
  - id: sensor_hw_init
    then:
      - output.turn_off: gpio_3_output
      - output.turn_on: gpio_14_output
      # 68 % duty is the operating point of the Seeed reference design, not a
      # "brightness" -- do not touch.
      - output.set_level:
          id: pwm_output
          level: 68%
      - logger.log: "Analog frontend on (GPIO14 power, 200kHz PWM @ 68%%)"

  - id: all_leds_off
    then:
      - light.turn_off: red_led
      - light.turn_off: yellow_led
      - light.turn_off: green_led

  # Status LED. Normal measurement: the colour 5 s solid. After a button press
  # (button_pressed): blink for button_blink_s in 250 ms steps --
  #   green / yellow / red : 500 ms on, 500 ms off
  #   calibrating          : yellow and green alternating every 500 ms
  #   sensor error         : red, fast (250 ms on / 250 ms off)
  - id: led_show_status
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(button_pressed);'
          then:
            - lambda: 'id(button_pressed) = false; id(led_tick) = 0;'
            - repeat:
                count: !lambda 'return ${button_blink_s} * 4;'
                then:
                  - lambda: |-
                      int t = id(led_tick)++;
                      bool first_half = (t % 4) < 2;
                      id(red_led).turn_off().perform();
                      id(yellow_led).turn_off().perform();
                      id(green_led).turn_off().perform();
                      switch (id(led_state)) {
                        case 1: if (first_half) id(green_led).turn_on().perform(); break;
                        case 2: if (first_half) id(yellow_led).turn_on().perform(); break;
                        case 3: if (first_half) id(red_led).turn_on().perform(); break;
                        case 4:
                          if (first_half) id(yellow_led).turn_on().perform();
                          else id(green_led).turn_on().perform();
                          break;
                        case 5: if (t % 2 == 0) id(red_led).turn_on().perform(); break;
                        default: break;
                      }
                  - delay: 250ms
          else:
            - lambda: |-
                // .perform() is mandatory -- turn_on() alone only builds a call
                switch (id(led_state)) {
                  case 1: id(green_led).turn_on().perform(); break;
                  case 2: case 4: id(yellow_led).turn_on().perform(); break;
                  case 3: case 5: id(red_led).turn_on().perform(); break;
                  default: break;
                }
            - delay: 5s
      - script.execute: all_leds_off

  # Open (or extend) the button wake window of button_awake_s.
  - id: open_button_window
    then:
      - lambda: |-
          id(wake_by_button) = true;
          uint32_t until = millis() + ${button_awake_s} * 1000UL;
          if (until > id(wake_window_until_ms)) id(wake_window_until_ms) = until;
          ESP_LOGI("button", "Button: awake for %u s", (unsigned) ${button_awake_s});

  # Button wake-up from deep sleep (on_boot): no measurement is running yet,
  # so window and blink flag can be set right away.
  - id: register_button_press
    then:
      - script.execute: open_button_window
      - lambda: 'id(button_pressed) = true;'

  # Button pressed while awake: measure again and blink the FRESH result.
  # 1. Open the window first, so a measurement already in flight does not
  #    send the device to sleep when it finishes.
  # 2. Only set the blink flag AFTER waiting for it -- set earlier, the
  #    in-flight measurement would consume it and the fresh one would show a
  #    solid LED instead (found in review of PR #30).
  - id: on_button_press
    then:
      - script.execute: open_button_window
      - script.wait: measure_and_sleep
      - lambda: 'id(button_pressed) = true;'
      - script.execute: measure_and_sleep

  - id: measure_and_sleep
    then:
      - logger.log: "=== MEASURE START ==="
      - script.execute: all_leds_off
      - lambda: 'id(led_state) = 0;'
      # Here as well, not only in on_boot: this script is also called by the
      # 60 s timer and the push button. Idempotent, costs nothing.
      - script.execute: sensor_hw_init

      # USB detection is only valid after the settle time, because ESP-IDF
      # initially assumes "connected" (see CLAUDE.md).
      - delay: ${usb_settle_ms}ms
      - lambda: |-
          id(usb_powered) = usb_serial_jtag_is_connected();
          id(power_mode).publish_state(id(usb_powered) ? "${state_power_usb}"
                                                       : "${state_power_battery}");
          const char *reason;
          switch (esp_reset_reason()) {
            case ESP_RST_POWERON:   reason = "POWERON";   break;
            case ESP_RST_SW:        reason = "SW";        break;
            case ESP_RST_PANIC:     reason = "PANIC";     break;
            case ESP_RST_DEEPSLEEP: reason = "DEEPSLEEP"; break;
            case ESP_RST_BROWNOUT:  reason = "BROWNOUT";  break;
            case ESP_RST_USB:       reason = "USB";       break;
            case ESP_RST_JTAG:      reason = "JTAG";      break;
            case ESP_RST_EXT:       reason = "EXT";       break;
            default:                reason = "OTHER";     break;
          }
          ESP_LOGI("power", "reset=%s  usb=%s", reason,
                   id(usb_powered) ? "YES" : "no");

      # With timeout! Without HA (router off, Wi-Fi gone) the script used to
      # hang forever -> no deep sleep, empty battery.
      - wait_until:
          condition:
            api.connected
          timeout: 60s

      - if:
          condition:
            not:
              api.connected:
          then:
            - logger.log: "No API connection -- measuring anyway, then sleeping"
          else:
            # Connected to HA: this firmware works well enough to receive the
            # next OTA, so confirm it now instead of after 60 s (issue #33).
            - lambda: |-
                static bool confirmed = false;   // once per boot is enough
                if (!confirmed) {
                  id(safe_mode_control).mark_successful();
                  confirmed = true;
                  ESP_LOGI("ota", "API connected -- firmware confirmed (no rollback)");
                }

      # Wait for the requested wake window from HA -- but ONLY if the answer
      # can change the decision. On USB or with the local override we stay
      # awake anyway.
      #
      # api.connected only means "connection is up"; the subscribed HA states
      # arrive shortly after. Without this wait the sleep decision would race
      # against that message. 2 s is plenty (HA answers within milliseconds)
      # and limits the cost if the helper does not exist in HA.
      - if:
          condition:
            lambda: 'return !id(usb_powered) && !id(disable_sleep);'
          then:
            - wait_until:
                condition:
                  lambda: 'return id(ha_stay_awake).has_state();'
                timeout: 2s

      - delay: 2s
      - lambda: |-
          id(battery_sensor).update();
          id(soil_samples).clear();

      # --- 5 soil readings, 20 ms apart, each averaging 16 hardware samples.
      #     A YAML loop instead of delay() inside a lambda: the old loop
      #     blocked for ~100 ms and triggered "took a long time for an
      #     operation" (issue #11). Same spacing, same values -- but the
      #     scheduler runs between the readings.
      - repeat:
          count: 5
          then:
            - lambda: |-
                id(soil_sensor).update();
                float v = id(soil_sensor).state;
                if (!std::isnan(v)) id(soil_samples).push_back(v);
            - delay: 20ms

      - lambda: |-
          const float V_MIN_PLAUSIBLE = ${v_min_plausible};
          const float V_MAX_PLAUSIBLE = ${v_max_plausible};
          const float MIN_SPAN = ${min_span};
          const float DECAY_FRAC_PER_DAY = ${decay_frac_per_day};
          const float CONFIRM_TOL = ${confirm_tol};

          // --- Median instead of mean: a single outlier drops out.
          auto &s = id(soil_samples);
          if (s.empty()) {
            ESP_LOGE("soil", "No valid ADC samples!");
            id(led_state) = 5;
            return;
          }
          std::sort(s.begin(), s.end());
          float moisture = s[s.size() / 2];
          id(soil_raw).publish_state(moisture);

          // ================= AUTO-CALIBRATION =================
          bool plausible = (moisture >= V_MIN_PLAUSIBLE &&
                            moisture <= V_MAX_PLAUSIBLE);

          if (!plausible) {
            // Report "unknown" honestly instead of a made-up percentage. The
            // Seeed original reported 100 % for a dead frontend (0.01 V).
            ESP_LOGW("autocal", "%.3f V implausible -> no reading, nothing learned",
                     moisture);
            id(pend_dry) = 0;
            id(pend_wet) = 0;
            id(soil_moisture_percent).publish_state(NAN);
            id(soil_status).publish_state("${state_sensor_error}");
            id(cal_dry_sensor).publish_state(id(dry_value));
            id(cal_wet_sensor).publish_state(id(wet_value));
            id(cal_span_sensor).publish_state(id(dry_value) - id(wet_value));
            id(next_sleep_sensor).publish_state(${sleep_error_min});
            id(led_state) = 5;
            id(deep_sleep_control).set_sleep_duration(${sleep_error_min} * 60 * 1000UL);
            return;
          } else if (!id(cal_seeded)) {
            // 0) SEED from the first real reading. Both limits start at the
            //    same value and then move apart. Only this way the reference
            //    is guaranteed to lie within what this hardware delivers.
            id(dry_value) = moisture;
            id(wet_value) = moisture;
            id(cal_seeded) = true;
            id(pend_dry) = 0;
            id(pend_wet) = 0;
            ESP_LOGI("autocal", "Calibration seeded at %.3f V", moisture);
          } else {
            uint32_t now = 0;
            auto t = id(ha_time).now();
            if (t.is_valid()) now = t.timestamp;

            // 1) Decay, RELATIVE to the span: both limits slowly move inwards
            //    so a single outlier heals.
            if (now > 0 && id(last_ts) > 0 && now > id(last_ts)) {
              float days = (now - id(last_ts)) / 86400.0f;
              float span = id(dry_value) - id(wet_value);
              if (span > MIN_SPAN) {
                float shrink = span * DECAY_FRAC_PER_DAY * days / 2.0f;
                float max_shrink = (span - MIN_SPAN) / 2.0f;
                if (shrink > max_shrink) shrink = max_shrink;
                id(dry_value) -= shrink;
                id(wet_value) += shrink;
              }
            }
            if (now > 0) id(last_ts) = now;

            // 2) New extremes -- only after confirmation by a 2nd reading
            if (moisture > id(dry_value)) {
              if (id(pend_dry) > 0 && fabsf(moisture - id(pend_dry)) < CONFIRM_TOL) {
                id(dry_value) = moisture;
                id(pend_dry) = 0;
                ESP_LOGI("autocal", "New DRY extreme confirmed: %.3f V", moisture);
              } else {
                id(pend_dry) = moisture;
                ESP_LOGI("autocal", "DRY candidate %.3f V (waiting for confirmation)",
                         moisture);
              }
            } else if (moisture < id(wet_value)) {
              if (id(pend_wet) > 0 && fabsf(moisture - id(pend_wet)) < CONFIRM_TOL) {
                id(wet_value) = moisture;
                id(pend_wet) = 0;
                ESP_LOGI("autocal", "New WET extreme confirmed: %.3f V", moisture);
              } else {
                id(pend_wet) = moisture;
                ESP_LOGI("autocal", "WET candidate %.3f V (waiting for confirmation)",
                         moisture);
              }
            } else {
              id(pend_dry) = 0;
              id(pend_wet) = 0;
            }
          }

          // 3) Percentage -- exclusively against the LEARNED range. No
          //    fallback to guessed factory values. If the span is too small,
          //    report "unknown" instead of an invented number.
          float dry = id(dry_value);
          float wet = id(wet_value);
          float span = dry - wet;

          id(cal_dry_sensor).publish_state(dry);
          id(cal_wet_sensor).publish_state(wet);
          id(cal_span_sensor).publish_state(span);

          if (span < MIN_SPAN) {
            char buf[96];
            snprintf(buf, sizeof(buf), "%s (%.3f/%.2f V)",
                     "${state_calibrating}", span, MIN_SPAN);
            ESP_LOGI("autocal", "Span %.3f V < %.2f V -> still calibrating, no percentage",
                     span, MIN_SPAN);
            id(soil_moisture_percent).publish_state(NAN);
            id(soil_status).publish_state(buf);
            id(next_sleep_sensor).publish_state(${sleep_calibrating_min});
            id(led_state) = 4;
            id(deep_sleep_control).set_sleep_duration(${sleep_calibrating_min} * 60 * 1000UL);
            return;
          }

          float percent = (dry - moisture) / span * 100.0f;
          if (percent < 0) percent = 0;
          if (percent > 100) percent = 100;
          id(soil_moisture_percent).publish_state(percent);

          // ---- Status + DYNAMIC sleep duration (drier = measure more often) ----
          const char *status;
          uint32_t sleep_min;
          if (percent < ${threshold_dry}) {
            status = "${state_dry}";
            sleep_min = ${sleep_dry_min};
            id(led_state) = 3;
          } else if (percent < ${threshold_wet}) {
            status = "${state_almost_dry}";
            sleep_min = ${sleep_almost_dry_min};
            id(led_state) = 2;
          } else {
            status = "${state_normal}";
            sleep_min = ${sleep_wet_min};
            id(led_state) = 1;
          }
          id(soil_status).publish_state(status);
          id(next_sleep_sensor).publish_state(sleep_min);

          ESP_LOGI("result", "%.3f V | %.1f %% | %s | sleep %u min | cal %.3f..%.3f (span %.3f)",
                   moisture, percent, status, (unsigned) sleep_min,
                   id(wet_value), id(dry_value), span);

          id(deep_sleep_control).set_sleep_duration(sleep_min * 60 * 1000UL);

      # Show the result on the LED: 5 s solid, or blinking after a button press.
      - script.execute: led_show_status
      - script.wait: led_show_status
      - delay: 5s          # time for the globals to be written to NVS

      - script.execute: decide_sleep

  # Publish "next measurement at" = now + seconds. Needs the HA clock; without
  # it the value stays unknown instead of showing an invented time.
  - id: publish_next_measurement
    parameters:
      seconds: int
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (t.is_valid()) {
            auto next = ESPTime::from_epoch_utc(t.timestamp + seconds);
            id(next_measurement_sensor).publish_state(next.strftime("%Y-%m-%dT%H:%M:%SZ"));
          } else {
            id(next_measurement_sensor).publish_state("");   // HA: unknown
          }

  # Sleep or stay awake? The order is intentional:
  # 1. USB              -> mains powered, battery irrelevant, always awake
  # 2. local switch     -> explicit user intent, latching
  # 3. button / HA      -> one-time, time limited window
  # 4. otherwise        -> sleep
  - id: decide_sleep
    then:
      - if:
          condition:
            lambda: 'return id(usb_powered) || id(disable_sleep);'
          then:
            - lambda: |-
                id(sleep_decision).publish_state(
                    id(usb_powered) ? "${state_awake_usb}" : "${state_awake_switch}");
            # Awake: the 60 s interval measures next.
            - script.execute:
                id: publish_next_measurement
                seconds: 60
            - logger.log:
                format: "Staying awake (usb=%d, override=%d) -- re-measuring every 60s"
                args: ['id(usb_powered)', 'id(disable_sleep)']
          else:
            - if:
                condition:
                  lambda: |-
                    // Window already open? Then only the remaining time
                    // counts, even if the flag in HA is still on. This is the
                    // hard battery guard against a forgotten input_boolean.
                    if (id(wake_window_until_ms) > 0)
                      return millis() < id(wake_window_until_ms);
                    // New request? has_state() is mandatory -- without HA the
                    // value is unknown and then we sleep (fail-safe).
                    return id(ha_stay_awake).has_state() && id(ha_stay_awake).state;
                then:
                  - script.execute: open_wake_window
                  - script.execute:
                      id: publish_next_measurement
                      seconds: 60
                else:
                  - lambda: 'id(sleep_decision).publish_state("${state_sleeping}");'
                  # Asleep: the timer wakes it after the chosen duration. Without a
                  # valid measurement the deep_sleep default (sleep_error_min) applies.
                  - script.execute:
                      id: publish_next_measurement
                      seconds: !lambda |-
                        float m = id(next_sleep_sensor).state;
                        return std::isnan(m) ? ${sleep_error_min} * 60 : (int) (m * 60);
                  # Give the state time to reach HA before Wi-Fi goes down.
                  - delay: 500ms
                  - deep_sleep.enter: deep_sleep_control

  # Redeem the wake window (OTA or reading logs on battery), requested from
  # HA or opened by the push button.
  - id: open_wake_window
    then:
      - lambda: |-
          if (id(wake_window_until_ms) == 0) {
            id(wake_window_until_ms) = millis() + id(wake_budget_min) * 60000UL;
            ESP_LOGI("wake", "Requested wake window opened: %u min",
                     (unsigned) id(wake_budget_min));
          }
          uint32_t left_min = 0;
          uint32_t now = millis();
          if (id(wake_window_until_ms) > now)
            left_min = (id(wake_window_until_ms) - now + 59999UL) / 60000UL;
          char buf[96];
          snprintf(buf, sizeof(buf), "%s (%u %s)",
                   id(wake_by_button) ? "${state_awake_button}" : "${state_awake_request}",
                   (unsigned) left_min, "${state_min_left}");
          id(sleep_decision).publish_state(buf);

      # Acknowledge the request: switch the input_boolean in HA off so it
      # stays a one-time wish. Needs "Allow the device to perform Home
      # Assistant actions" in HA. Without it nothing breaks -- the time
      # window above limits the awake time anyway.
      - if:
          condition:
            lambda: 'return id(ha_stay_awake).has_state() && id(ha_stay_awake).state;'
          then:
            - homeassistant.action:
                action: input_boolean.turn_off
                data:
                  entity_id: ${stay_awake_entity}
                on_error:
                  - logger.log:
                      level: WARN
                      format: "Could not reset the input_boolean -- are HA actions allowed?"

  # 3x short press: discard learned values and learn again
  - id: reset_calibration
    then:
      - logger.log: "=== CALIBRATION RESET ==="
      - deep_sleep.prevent: deep_sleep_control
      - lambda: |-
          // NOT back to guessed factory values -- that was the bug. Clearing
          // cal_seeded makes the next real reading seed again.
          id(cal_seeded) = false;
          id(dry_value) = 0;
          id(wet_value) = 0;
          id(pend_dry) = 0;
          id(pend_wet) = 0;
          id(last_ts) = 0;
          ESP_LOGI("autocal", "Calibration discarded -- next reading seeds again");
      - script.execute: all_leds_off
      # blink green twice = reset ok
      - repeat:
          count: 2
          then:
            - light.turn_on: green_led
            - delay: 200ms
            - light.turn_off: green_led
            - delay: 200ms
      - delay: 2s
      # Keep prevent/allow paired. (deep_sleep.enter calls
      # begin_sleep(manual=true) and ignores prevent -- allow is hygiene only.)
      - deep_sleep.allow: deep_sleep_control
      - script.execute: measure_and_sleep
