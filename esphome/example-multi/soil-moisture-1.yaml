# =============================================================================
# Device file for one of several sensors, using the shared file
# common/soil-moisture.yaml (version + package defined once).
#
# Needed in the Device Builder's secrets.yaml: wifi_ssid, wifi_password,
# soil_1_api_key. Needed in Home Assistant: the two helpers below, see
# homeassistant/soil_moisture_helpers.yaml in the repository.
# =============================================================================

substitutions:
  name: soil-moisture-1
  friendly_name: Soil Moisture 1
  language: en          # en or de -- choose once, see README "Languages"
  stay_awake_entity: input_boolean.soil_moisture_1_stay_awake
  disable_sleep_entity: input_boolean.soil_moisture_1_disable_sleep
  api_encryption_key: !secret soil_1_api_key

  # Optional: this sensor only runs another release or branch
  # firmware_version: v2.1.0

packages:
  common: !include common/soil-moisture.yaml
