# =============================================================================
# Example device file for the ESPHome Device Builder (Home Assistant add-on).
#
# One file per sensor. Copy this file, change the substitutions, done. All
# firmware logic comes from the GitHub package below and is identical on
# every sensor.
#
# Needed in the Device Builder's secrets.yaml (/config/esphome/secrets.yaml):
#   wifi_ssid, wifi_password                    (shared by all devices)
#   soil_1_api_key                              (one per device)
#
# Needed in Home Assistant: two input_booleans per device, see
# homeassistant/soil_moisture_helpers.yaml in the repository.
# =============================================================================

substitutions:
  # Release to run. Replace vX.Y.Z with the latest release from
  # https://github.com/norbertbaum/ESPHome_Seeed_XIAO_Soil_Moisture_Sensor/releases/latest
  # (e.g. v1.1.0), or use "main" for the latest development state.
  # Used as the package ref below AND shown as the firmware version in HA.
  firmware_version: vX.Y.Z

  # Hostname: lowercase, digits and "-" only, unique per device.
  name: soil-moisture-1
  # Shown in Home Assistant; entity names are prefixed with it.
  friendly_name: Soil Moisture 1

  # The "mailbox" helper in HA that requests a wake window (for OTA on
  # battery). One per device -- a shared helper would be cleared by whichever
  # device wakes up first.
  stay_awake_entity: input_boolean.soil_moisture_1_stay_awake

  # Latching "do not sleep" helper in HA, also one per device. Switch it on
  # (even while the sensor sleeps) and the sensor stays awake from its next
  # wake-up until you switch it off again. Mind the battery.
  disable_sleep_entity: input_boolean.soil_moisture_1_disable_sleep

  # Per-device credentials. The API key must be 32 bytes, base64 encoded
  # (the Device Builder generates one when you create a new device). It also
  # encrypts and authenticates OTA uploads -- there is no OTA password.
  api_encryption_key: !secret soil_1_api_key

  # Optional: override any tuning default of the base package, e.g.
  # threshold_dry: "30"
  # sleep_wet_min: "240"

packages:
  soil_moisture:
    url: https://github.com/norbertbaum/ESPHome_Seeed_XIAO_Soil_Moisture_Sensor
    ref: ${firmware_version}
    refresh: 1d
    files:
      # Pick exactly ONE language:
      - esphome/labels/.soil-moisture-labels-en.yaml
      # - esphome/labels/.soil-moisture-labels-de.yaml
      - esphome/.soil-moisture.base.yaml

# Optional per-device additions are merged into the package, e.g. a fixed
# address when mDNS does not work in your network:
# wifi:
#   use_address: 192.168.1.50
