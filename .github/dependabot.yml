# Keeps the ESPHome pin (requirements.txt) and the GitHub Actions current.
# Every bump arrives as a PR, and CI then proves the firmware still builds.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
