# Keeps the ESPHome pin (requirements.txt) and the GitHub Actions current.
# Every bump arrives as a PR, and CI then proves the firmware still builds.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "deps"
    # Dependabot holds back every new release for 3 days by default (supply
    # chain protection), even without a cooldown block. The project policy is
    # "always test against the newest ESPHome" (CLAUDE.md), so ESPHome is
    # exempt: a release is proposed on the next daily run (issue #43).
    cooldown:
      exclude:
        - "esphome"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
