name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly run against the newest ESPHome release, so upstream breakage shows
  # up even when nothing in this repo changes.
  schedule:
    - cron: "17 4 * * 1"

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - run: python tests/check_labels.py

  build:
    name: build (${{ matrix.lang }}, ${{ matrix.esphome }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [en, de]
        # pinned = requirements.txt (reproducible, bumped by Dependabot)
        # latest = newest ESPHome on PyPI (early warning)
        esphome: [pinned, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Cache PlatformIO toolchains
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.esphome }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install ESPHome (pinned)
        if: matrix.esphome == 'pinned'
        run: pip install -r requirements.txt
      - name: Install ESPHome (latest)
        if: matrix.esphome == 'latest'
        run: pip install --upgrade esphome
      - run: esphome version
      - name: Validate
        run: esphome config tests/soil-test-${{ matrix.lang }}.yaml 2>&1 | tee config.txt
      # Security guard (issues #19, #20, #23): only the encrypted esphome OTA
      # may exist -- no plaintext web_server /update endpoint, no OTA
      # warnings, no fallback hotspot or captive portal.
      - name: Check OTA security
        run: |
          if sed -n '/^ota:/,/^[a-z_]*:$/p' config.txt | grep -q 'platform: web_server'; then
            echo "::error::ota contains platform web_server (plaintext /update endpoint)"; exit 1
          fi
          if grep -E 'WARNING.*(OTA|ota)' config.txt; then
            echo "::error::OTA related warning in esphome config"; exit 1
          fi
          if grep -q '^captive_portal:' config.txt; then
            echo "::error::captive_portal must not be configured"; exit 1
          fi
          if sed -n '/^wifi:/,/^[a-z_]*:$/p' config.txt | grep -q '^  ap:'; then
            echo "::error::wifi fallback hotspot (ap:) must not be configured"; exit 1
          fi
          echo "OTA: only the encrypted esphome platform, no hotspot"
      - name: Compile
        run: esphome compile tests/soil-test-${{ matrix.lang }}.yaml
